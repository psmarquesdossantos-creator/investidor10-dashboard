# .github/workflows/ci.yml
# CI/CD Pipeline para Investidor10 Dashboard

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  lint:
      name: Lint & Validate
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: 'npm'
        - run: npm ci --prefer-offline --no-audit
        - name: Syntax check all JS files
          run: |
            for f in *.js src/**/*.js tests/e2e/*.spec.js; do
              node --check "$f" || exit 1
            done
        - run: npx htmlhint index.html --format unix
        - run: |
            npx eslint@8 *.js --format unix --no-eslintrc \
              --parser-options=ecmaVersion:2022,sourceType:module \
              --env browser,es2022 \
              --rule 'no-unused-vars: warn' \
              --rule 'no-console: off'
        - run: |
            if grep -r "console\\.error" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git . | grep -v "test\\|spec"; then
              echo "ERROR: console.error encontrado em codigo de producao"
              exit 1
            fi
        - run: |
            find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" | xargs -I {} sh -c 'echo "Validating {}" && python3 -m json.tool {} > /dev/null'
        - run: npm audit --audit-level=high

  test-desktop:
    name: E2E Tests - Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - name: Setup sample data (real carteira-data.js is gitignored)
        run: cp carteira-data.sample.js carteira-data.js
      - run: npx playwright install chromium --with-deps
      - name: Start test server
        run: |
          python3 serve.py &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5
          curl -f http://localhost:8765/index.html || exit 1
      - run: npx playwright test --project=desktop --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-desktop
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - run: kill ${{ env.SERVER_PID }} || true
        if: always()

  test-mobile:
    name: E2E Tests - Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - name: Setup sample data (real carteira-data.js is gitignored)
        run: cp carteira-data.sample.js carteira-data.js
      - run: npx playwright install chromium --with-deps
      - name: Start test server
        run: |
          python3 serve.py &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5
          curl -f http://localhost:8765/index.html || exit 1
      - run: npx playwright test --project=mobile --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - run: kill ${{ env.SERVER_PID }} || true
        if: always()

  test-tablet:
    name: E2E Tests - Tablet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - name: Setup sample data (real carteira-data.js is gitignored)
        run: cp carteira-data.sample.js carteira-data.js
      - run: npx playwright install chromium --with-deps
      - name: Start test server
        run: |
          python3 serve.py &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5
          curl -f http://localhost:8765/index.html || exit 1
      - run: npx playwright test --project=tablet --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8765
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-tablet
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - run: kill ${{ env.SERVER_PID }} || true
        if: always()

  a11y:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - name: Setup sample data (real carteira-data.js is gitignored)
        run: cp carteira-data.sample.js carteira-data.js
      - run: npx playwright install chromium --with-deps
      - name: Start test server
        run: |
          python3 serve.py &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5
          curl -f http://localhost:8765/index.html || exit 1
      - run: npx playwright test --project=desktop tests/e2e/a11y.spec.js --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8765
      - run: kill ${{ env.SERVER_PID }} || true
        if: always()

  security:
    name: Security Headers Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - run: npx playwright install chromium --with-deps
      - name: Start test server
        run: |
          python3 serve.py &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5
      - name: Validate security headers
        run: python3 .github/scripts/check_security_headers.py
      - run: kill ${{ env.SERVER_PID }} || true
        if: always()

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-desktop, test-mobile, test-tablet, a11y, security]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - name: Create production build
        run: |
          mkdir -p dist
          cp index.html dist/
          cp *.js dist/ 2>/dev/null || true
          cp *.css dist/
          cp -r assets dist/ 2>/dev/null || true
          cp serve.py dist/
          cp manifest.json dist/ 2>/dev/null || true
          cp sw.js dist/ 2>/dev/null || true
          cp robots.txt dist/ 2>/dev/null || true
          cp -r vendor dist/ 2>/dev/null || true
          echo "{\"version\": \"$(git describe --tags --always --dirty)\", \"buildDate\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"commit\": \"$(git rev-parse HEAD)\"}" > dist/version.json
          cd dist && zip -r ../investidor10-dashboard-$(git describe --tags --always --dirty).zip .
      - uses: actions/upload-artifact@v4
        with:
          name: investidor10-dashboard-build
          path: |
            dist/
            *.zip
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: investidor10-dashboard-*.zip
          generate_release_notes: true

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: investidor10-dashboard-build
          path: dist/
      - uses: peaceiris/actions-gh-pages@v3
        if: github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.pull_request.number }}
          enable_jekyll: false
      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Preview: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/index.html'
            })

  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-desktop, test-mobile, test-tablet, a11y, security, build]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.test-desktop.result }}" == "success" && \
                "${{ needs.test-mobile.result }}" == "success" && \
                "${{ needs.test-tablet.result }}" == "success" && \
                "${{ needs.a11y.result }}" == "success" && \
                "${{ needs.security.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All checks passed!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Some checks failed" >> $GITHUB_OUTPUT
          fi
      - run: |
          echo "${{ steps.status.outputs.message }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
          echo "Status: ${{ steps.status.outputs.status }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"